  # - envsubst < helm_values/grafana-values.yaml > $SUBSTITUTED_VALUES

  # - kubectl delete cm grafana-dashboards -n monitoring && kubectl create configmap grafana-dashboards --from-file=dashboards/ --namespace monitoring

