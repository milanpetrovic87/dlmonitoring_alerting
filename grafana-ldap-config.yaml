apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ldap-config
  namespace: monitoring
data:
  ldap.toml: |
    [[servers]]
    host = "192.168.111.100"
    port = 389
    use_ssl = false
    start_tls = true
    bind_dn = "CN=DLAdmin,OU=Data Lake,OU=Service accounts,DC=ad,DC=company,DC=com"
    bind_password = "password"
    search_filter = "(sAMAccountName=%s)"
    search_base_dns = ["DC=ad,DC=company,DC=com"]

    [servers.attributes]
    name = "givenName"
    surname = "sn"
    username = "sAMAccountName"
    member_of = "memberOf"
    email = "mail"

    [[servers.group_mappings]]
    group_dn = "*"
    org_role = "Viewer"
